{% extends "base.html" %}
{% block title %}{{ code }} · {% endblock %}
{% block content %}
<div class="error-page">
  <div class="error-code">{{ code }}</div>
  <p>{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard.index') }}">Go to dashboard</a>
</div>
{% endblock %}
{% block auth_content %}
<div class="auth-card error-page">
  <div class="error-code">{{ code }}</div>
  <p>{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Go to sign in</a>
</div>
{% endblock %}
